<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">File types supported by KM Digital Labs CodeSpace</title>
  <desc id="desc">Visual cards for HTML, CSS, JavaScript and JSX, TypeScript and TSX, JSON, Markdown, PHP, Python, YAML, XML, and image files.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="440" gradientUnits="userSpaceOnUse"><stop stop-color="#171916"/><stop offset="1" stop-color="#20251f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000" flood-opacity=".24"/></filter>
    <style>
      .card{fill:#252923;stroke:#ffffff;stroke-opacity:.10}.label{fill:#f5f2e9;font:600 17px Inter,Arial,sans-serif}.meta{fill:#92998e;font:12px ui-monospace,Consolas,monospace}.ext{font:700 20px ui-monospace,Consolas,monospace;text-anchor:middle}.file{fill:#171916;stroke:#ffffff;stroke-opacity:.15;stroke-width:1.5}.fold{fill:none;stroke:#ffffff;stroke-opacity:.32;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="440" rx="28" fill="url(#bg)"/>
  <path d="M0 112C242 22 427 164 650 74c223-90 360-48 550 3" fill="none" stroke="#f36a2d" stroke-opacity=".13" stroke-width="90"/>
  <text x="42" y="48" fill="#ff9b6e" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="13" letter-spacing="2.2">EDIT WITH CONFIDENCE</text>
  <text x="42" y="80" fill="#f5f2e9" font-family="Inter,Arial,sans-serif" font-weight="650" font-size="25">One workspace. Your essential project files.</text>

  <g transform="translate(42 112)" filter="url(#shadow)"><rect class="card" width="172" height="126" rx="16"/><g transform="translate(18 19)"><path class="file" d="M5 0h31l13 13v55H5z"/><path class="fold" d="M36 0v13h13"/><text class="ext" x="27" y="43" fill="#f36a2d">&lt;/&gt;</text></g><text class="label" x="80" y="48">HTML</text><text class="meta" x="80" y="72">.html · .htm</text></g>
  <g transform="translate(230 112)" filter="url(#shadow)"><rect class="card" width="172" height="126" rx="16"/><g transform="translate(18 19)"><path class="file" d="M5 0h31l13 13v55H5z"/><path class="fold" d="M36 0v13h13"/><text class="ext" x="27" y="43" fill="#8eb69b">#</text></g><text class="label" x="80" y="48">CSS</text><text class="meta" x="80" y="72">.css</text></g>
  <g transform="translate(418 112)" filter="url(#shadow)"><rect class="card" width="220" height="126" rx="16"/><g transform="translate(18 19)"><path class="file" d="M5 0h31l13 13v55H5z"/><path class="fold" d="M36 0v13h13"/><text class="ext" x="27" y="43" fill="#e7ad58">JS</text></g><text class="label" x="80" y="48">JavaScript</text><text class="meta" x="80" y="72">.js · .mjs · .jsx</text></g>
  <g transform="translate(654 112)" filter="url(#shadow)"><rect class="card" width="220" height="126" rx="16"/><g transform="translate(18 19)"><path class="file" d="M5 0h31l13 13v55H5z"/><path class="fold" d="M36 0v13h13"/><text class="ext" x="27" y="43" fill="#96a5c8">TS</text></g><text class="label" x="80" y="48">TypeScript</text><text class="meta" x="80" y="72">.ts · .tsx</text></g>
  <g transform="translate(890 112)" filter="url(#shadow)"><rect class="card" width="172" height="126" rx="16"/><g transform="translate(18 19)"><path class="file" d="M5 0h31l13 13v55H5z"/><path class="fold" d="M36 0v13h13"/><text class="ext" x="27" y="43" fill="#cdd9c8">{ }</text></g><text class="label" x="80" y="48">JSON</text><text class="meta" x="80" y="72">.json</text></g>

  <g transform="translate(42 254)" filter="url(#shadow)"><rect class="card" width="172" height="126" rx="16"/><g transform="translate(18 19)"><path class="file" d="M5 0h31l13 13v55H5z"/><path class="fold" d="M36 0v13h13"/><text class="ext" x="27" y="43" fill="#d6a184">MD</text></g><text class="label" x="80" y="48">Markdown</text><text class="meta" x="80" y="72">.md</text></g>
  <g transform="translate(230 254)" filter="url(#shadow)"><rect class="card" width="172" height="126" rx="16"/><g transform="translate(18 19)"><path class="file" d="M5 0h31l13 13v55H5z"/><path class="fold" d="M36 0v13h13"/><text class="ext" x="27" y="43" fill="#b2a4bd">PHP</text></g><text class="label" x="80" y="48">PHP</text><text class="meta" x="80" y="72">.php</text></g>
  <g transform="translate(418 254)" filter="url(#shadow)"><rect class="card" width="172" height="126" rx="16"/><g transform="translate(18 19)"><path class="file" d="M5 0h31l13 13v55H5z"/><path class="fold" d="M36 0v13h13"/><text class="ext" x="27" y="43" fill="#90b89c">PY</text></g><text class="label" x="80" y="48">Python</text><text class="meta" x="80" y="72">.py</text></g>
  <g transform="translate(606 254)" filter="url(#shadow)"><rect class="card" width="172" height="126" rx="16"/><g transform="translate(18 19)"><path class="file" d="M5 0h31l13 13v55H5z"/><path class="fold" d="M36 0v13h13"/><text class="ext" x="27" y="43" fill="#e7ad58">YML</text></g><text class="label" x="80" y="48">YAML</text><text class="meta" x="80" y="72">.yml · .yaml</text></g>
  <g transform="translate(794 254)" filter="url(#shadow)"><rect class="card" width="172" height="126" rx="16"/><g transform="translate(18 19)"><path class="file" d="M5 0h31l13 13v55H5z"/><path class="fold" d="M36 0v13h13"/><text class="ext" x="27" y="43" fill="#9ea39a">XML</text></g><text class="label" x="80" y="48">XML</text><text class="meta" x="80" y="72">.xml</text></g>
  <g transform="translate(982 254)" filter="url(#shadow)"><rect class="card" width="176" height="126" rx="16"/><g transform="translate(18 19)"><path class="file" d="M5 0h31l13 13v55H5z"/><path class="fold" d="M36 0v13h13"/><circle cx="20" cy="28" r="5" fill="#e58baa"/><path d="m10 57 10-11 8 8 8-12 13 15" fill="none" stroke="#e58baa" stroke-width="3"/></g><text class="label" x="80" y="48">Images</text><text class="meta" x="80" y="72">SVG · PNG · JPG</text></g>
</svg>
